
modLoader = "kotlinforforge"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
logoFile = "logo.png"
logoBlur = false
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayTest = "MATCH_VERSION"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "kotlinforforge"
mandatory = true
versionRange = "[4.13.0,4.14.0)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "obsidiancore"
mandatory = true
versionRange = "[1.0.3]"
ordering = "BEFORE"
side = "BOTH"


# ==========================================
# Optional FTB Integrations
# ==========================================

[[dependencies.${mod_id}]]
modId = "ftbchunks"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbteams"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbranks"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbessentials"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

