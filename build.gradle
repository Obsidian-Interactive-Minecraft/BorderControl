
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Optional integration configuration
def integrationEnabled = { String name ->
    providers.gradleProperty('allIntegrations')
            .map { it.toBoolean() }
            .orElse(false)
            .get() ||
            providers.gradleProperty(name)
                    .map { it.toBoolean() }
                    .orElse(false)
                    .get()
}

// Minecraft Forge configuration
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// Generated resources
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Dependency repositories
repositories {
    mavenCentral()

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'

        content {
            includeGroup 'thedarkcolour'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'

        content {
            includeGroup 'curse.maven'
        }
    }
}

// Dependencies
dependencies {
    // Minecraft Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Required dependencies
    implementation 'thedarkcolour:kotlinforforge:4.13.0'
    implementation fg.deobf("curse.maven:obsidian-core-mod-1596086:8666842")

    // Optional integration groups
    def integrations = [

            // FTB ecosystem
            ftbIntegration: [
                    'curse.maven:ftb-chunks-forge-314906:8216874',
                    'curse.maven:ftb-teams-forge-404468:7499810',
                    'curse.maven:ftb-ranks-forge-314905:6522073',
                    'curse.maven:ftb-essentials-410811:7609948',

                    // Required FTB libraries
                    'curse.maven:ftb-library-forge-404465:8226927',
                    'curse.maven:architectury-api-419699:5137938'
            ],

            /* LuckPerms
            luckPermsIntegration: [
                    'curse.maven:luckperms-431733:4738950'
            ],

            // Immersive Vehicles
            ivIntegration: [
                    'curse.maven:minecraft-transport-simulator-286703:7926604'
            ],

            // Create
            createIntegration: [
                    'curse.maven:create-328085:7178761'
            ],

            // Open Parties and Claims
            claimsIntegration: [
                    'curse.maven:open-parties-and-claims-636608:9221982'
            ],

            // Xaero's Minimap and World Map
            mapIntegration: [
                    'curse.maven:xaeros-minimap-263420:9067172',
                    'curse.maven:xaeros-world-map-317780:9067273'
            ] */
    ]

    println ''
    println '[BorderControl] Optional integrations:'

    integrations.each { flag, mods ->
        def enabled = integrationEnabled(flag)

        mods.each { dependency ->
            // Always available during compilation
            compileOnly fg.deobf(dependency)

            // Only loaded at runtime when enabled
            if (enabled) {
                runtimeOnly fg.deobf(dependency)
            }
        }

        println "[BorderControl] ${flag}: ${enabled ? 'ENABLED' : 'DISABLED'}"
    }

    println ''
}

// Shared compilation output
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")

    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
    it.kotlin.destinationDirectory = dir
}

// Resource processing
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// JAR configuration
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"       : mod_id,
                "Specification-Vendor"      : mod_authors,
                "Specification-Version"     : "1",
                "Implementation-Title"      : project.name,
                "Implementation-Version"    : project.jar.archiveVersion,
                "Implementation-Vendor"     : mod_authors,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// Java compiler configuration
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}